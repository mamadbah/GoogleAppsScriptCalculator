<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;

}

.container{

    width:100%;
    max-width:1100px;

    display:grid;
    grid-template-columns:420px 1fr;

    gap:30px;

}

.calculator-card{

    background:white;

    border-radius:20px;

    padding:30px;

    box-shadow:0 20px 40px rgba(0,0,0,.25);

}

.header{

    text-align:center;
    margin-bottom:25px;

}

.header h1{

    color:#1e3c72;
    font-size:34px;
    margin-bottom:5px;

}

.subtitle{

    color:#666;
    margin-bottom:12px;

}

#clock{

    color:#1e3c72;
    font-weight:bold;

}

.display{

    width:100%;

    height:75px;

    border:none;

    border-radius:12px;

    background:#eef4ff;

    text-align:right;

    font-size:34px;

    padding:15px;

    margin-bottom:20px;

    color:#222;

    box-shadow:inset 0 2px 6px rgba(0,0,0,.1);

}

.buttons{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;

}

.btn{

    height:70px;

    border:none;

    border-radius:12px;

    font-size:24px;

    cursor:pointer;

    background:#f3f4f6;

    transition:.25s;

    font-weight:bold;

}

.btn:hover{

    transform:translateY(-3px);

    box-shadow:0 8px 16px rgba(0,0,0,.18);

}

.operator{

    background:#2563eb;

    color:white;

}

.equal{

    background:#10b981;

    color:white;

}

.clear{

    background:#ef4444;

    color:white;

}

.zero{

    grid-column:span 2;

}

.history-card{

    background:white;

    border-radius:20px;

    padding:30px;

    box-shadow:0 20px 40px rgba(0,0,0,.25);

}

.history-card h2{

    color:#1e3c72;

    margin-bottom:20px;

}

#history{

    max-height:520px;

    overflow-y:auto;

}

.history-item{

    background:#eef4ff;

    border-left:5px solid #2563eb;

    padding:12px;

    margin-bottom:12px;

    border-radius:10px;

}

.empty{

    color:#888;
    text-align:center;
    margin-top:40px;

}

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

}

</style>
